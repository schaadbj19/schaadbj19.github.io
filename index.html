<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f5d62">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2a37;--mut:#6b7280;--line:#e5e2d9;--acc:#2f5d62;--acct:#fff;--hdr:#2f5d62;--bad:#fecaca;--warn:#fde68a;--lock:#fdba74;--inp:#fff;--hd:#eef2f1;--gl:#cfcab9;--pre:#f3f4f6;color-scheme:light}
:root[data-theme=dark]{--bg:#12161a;--card:#1b2127;--ink:#e6e9ec;--mut:#9aa4ae;--line:#2b343c;--acc:#6fb3b9;--acct:#0b1114;--hdr:#1f3f43;--bad:#7f1d1d;--warn:#6b5210;--lock:#8a4a12;--inp:#242c33;--hd:#222a31;--gl:#3a444d;--pre:#0f1317;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hdr);color:#fff;padding:14px 24px}
header h1{margin:0;font-size:20px;font-weight:600}
nav{display:flex;gap:4px;padding:8px 24px 0;border-bottom:1px solid var(--line);background:var(--card);overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;font:inherit;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent;border-radius:0;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{padding:20px 24px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:17px} h3{margin:16px 0 6px;font-size:15px}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--inp);color:var(--ink);max-width:100%}
select{max-width:230px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 10px}
button.pri{background:var(--acc);color:var(--acct);border-color:var(--acc)}
button.x{color:#dc2626;border:0;background:none;padding:2px 6px}
button.lk{border:0;background:none;padding:2px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}
td.c,th.c{text-align:center}
.mut{color:var(--mut)} .hint{color:var(--mut);margin:0 0 10px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.scroll{overflow-x:auto} .nw{white-space:nowrap} .chk{margin-right:12px}
pre{max-height:260px;overflow:auto;background:var(--pre);padding:10px;border-radius:6px;font-size:12px}
/* Plan-Raster */
.grid{border-collapse:collapse;width:100%}
.grid th,.grid td{border:1px solid var(--gl);padding:4px 6px;vertical-align:middle;text-align:center}
.grid th.rl{background:var(--c,var(--acc));color:var(--ct,var(--acct));text-align:left;min-width:130px;font-size:13px}
.grid th.rl small{display:block;font-weight:400;opacity:.85}
.grid th.rl.rn{background:var(--hd);color:var(--ink)}
.grid th.dh{background:var(--hd);color:var(--ink);white-space:nowrap;min-width:160px;font-size:13px}
.grid td.ar{background:var(--card);background:color-mix(in srgb,var(--c) 16%,var(--card))}
.grid td.sub{text-align:left;font-size:12px;color:var(--mut);vertical-align:top}
.sl{display:flex;align-items:center;gap:2px;margin:2px 0;padding:2px;border-radius:5px}
.sl select{flex:1;min-width:0;width:100%;max-width:none;font-size:13px}
.sl.bad{background:var(--bad)} .sl.warn{background:var(--warn)}
.sl.dbl select{color:#dc2626;font-weight:700}
.pv{display:none}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.t1{font-size:22px;font-weight:700;letter-spacing:.5px} .t2{font-size:18px;color:var(--acc);font-weight:600}
.stand{font-size:13px;color:var(--mut)}
.legend{margin-top:10px;font-size:12px}
.legend .dbl{color:#c00000;font-weight:700}
/* Verfügbarkeit */
.mx td{text-align:center;font-size:12px;min-width:92px;vertical-align:middle}
.mx th.nm{position:sticky;left:0;background:var(--card);color:var(--ink);font-weight:500;white-space:nowrap;z-index:1}
.mx td.cb{background:var(--bad)}
.mx td.cs{background:var(--lock)}
.mx td.cl{background:var(--warn);background:color-mix(in srgb,var(--warn) 50%,var(--card))}
.mx td.cf{background:color-mix(in srgb,#2f855a 22%,var(--card))}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--c);color:var(--ct);font-size:11px;margin:1px}
/* Präferenzen */
.pf{width:96px}
.pf-no{opacity:.6}
.pf-more{border-color:#2f855a;border-width:2px}
.pf-less{border-color:#c2410c;border-width:2px}
@page{size:A4 landscape;margin:10mm}
@media print{
 :root[data-theme]{--bg:#fff;--card:#fff;--ink:#000;--mut:#444;--line:#ccc;--hd:#eef2f1;--gl:#555;--bad:#fecaca;--warn:#fde68a;--inp:#fff;color-scheme:light}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,nav,.noprint{display:none!important}
 body{background:#fff;font-size:11px}
 main{padding:0;max-width:none}
 .card{border:0;padding:0;margin:0;border-radius:0}
 .scroll{overflow:visible}
 .pv{display:block}
 .sl{display:block;margin:0;padding:1px 0;background:none!important}
 .sl.dbl .pv{color:#c00000;font-weight:700}
 .grid th,.grid td{border:1px solid #555;padding:3px 4px;min-width:0!important}
 .grid th.dh{white-space:normal}
}
</style>
</head>
<body>
<header><h1>Dienstplaner · Technik &amp; Ordnungsdienst</h1></header>
<nav>
 <button data-t="plan" onclick="go('plan')">Dienstplan</button>
 <button data-t="verf" onclick="go('verf')">Verfügbarkeit</button>
 <button data-t="abw" onclick="go('abw')">Abwesenheiten</button>
 <button data-t="aufg" onclick="go('aufg')">Aufgaben &amp; PDF-Import</button>
 <button data-t="pers" onclick="go('pers')">Personen</button>
 <button data-t="einst" onclick="go('einst')">Einstellungen</button>
</nav>
<main id="app"></main>

<script>
/* ============ Grundlagen ============ */
const KEY='dienstplaner_v2';
const uid=()=>Math.random().toString(36).slice(2,9);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const toD=s=>new Date(s+'T12:00:00');
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MN=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtS=s=>{if(!s)return '';const [y,m,d]=s.split('-');return d+'.'+m+'.'+y;};
const fmt=s=>WD[toD(s).getDay()]+', '+fmtS(s);
const dayHead=s=>WD[toD(s).getDay()]+' '+fmtS(s);
const monthLabel=m=>{const [y,mo]=m.split('-');return MN[Number(mo)-1]+' '+y;};
const byName=(a,b)=>a.name.localeCompare(b.name,'de');
const LEG='ROT = DOPPELT EINGETEILT\nNAME/NAME = WECHSEL WÄHREND DES PROGRAMMS; REIHENFOLGE WIE IM PLAN\nRUNDGANG + LÜFTEN UND FOYERORDNER WECHSELN IN DER MITTE DES PROGRAMMS';

/* Formular-Modus: Link mit #f=... öffnet nur das Abwesenheits-Formular */
function parseFormHash(){
  const m=location.hash.match(/^#f=([A-Za-z0-9_-]*)$/);if(!m)return null;
  try{
    const b=m[1].replace(/-/g,'+').replace(/_/g,'/');
    const o=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
    return o&&typeof o==='object'?o:null;
  }catch(e){return null;}
}
const FORM=parseFormHash();

const ink=hex=>{const h=String(hex||'#888888').replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return (r*299+g*587+b*114)/1000>155?'#111':'#fff';};
const cv=hex=>`--c:${hex};--ct:${ink(hex)}`;

function defaultBereiche(){return [{id:uid(),name:'Ordnung',farbe:'#2b6cb0'},{id:uid(),name:'Technik',farbe:'#2f855a'}];}
function defaults(){
  const bereiche=defaultBereiche();
  const B=n=>bereiche.find(b=>b.name===n).id;
  const dienste=[
    ['SAAL','Ordnung',1,false],['RUNDGANG + LÜFTEN','Ordnung',2,true],['FOYER','Ordnung',2,true],
    ['BÜHNE','Technik',1,false],['MIKRO 1+2','Technik',2,false],['MEDIEN','Technik',1,false],
    ['ZOOM','Technik',1,false],['AUDIO','Technik',1,false]
  ].map(([name,g,plaetze,wechsel])=>({id:uid(),name,bereich:B(g),plaetze,wechsel}));
  const types=[
    ['Vorsitz',10,'vorsitz',''],
    ['WT-Leiter',8,'wt leiter',''],
    ['WT-Leser',4,'wt leser',''],
    ['Bibelstudium Leiter/Leser',4,'bibelstudium',''],
    ['Bibellesung',2,'bibellesung',''],
    ['Gebet',1,'gebet',''],
    ['Schülerteil (Gespräch/Demo)',2,'teilnehmer partner;gesprache beginnen;interesse fordern;glaubensansichten;was wurdest du sagen',''],
    ['Kurzer Teil (bis 5 Min.)',2,'',5],
    ['Teil bis 10 Min.',5,'',10],
    ['Langer Teil (über 10 Min.)',8,'',999],
    ['Sonstige Aufgabe',3,'','']
  ].map(([name,gewicht,keywords,bis])=>({id:uid(),name,gewicht,keywords,bis}));
  return {persons:[],absences:[],tasks:[],skip:[],plans:[],settings:{dienste,bereiche,types,meetingDays:[3,0],midweek:3,schwelle:5,maxPro:0,prefStaerke:1,theme:'auto',legende:LEG,formTitel:'',formTel:'',formMail:'',formNamen:true}};
}
let S;
function fixS(){
  S.skip=S.skip||[];S.plans=S.plans||[];S.absences=S.absences||[];S.tasks=S.tasks||[];S.persons=S.persons||[];
  const st=S.settings;
  st.legende=st.legende??LEG;
  if(st.midweek==null)st.midweek=3;
  if(!st.bereiche||!st.bereiche.length)st.bereiche=defaultBereiche();
  st.dienste.forEach(d=>{
    if(!d.bereich||!st.bereiche.some(b=>b.id===d.bereich)){
      const b=st.bereiche.find(b=>norm(b.name)===norm(d.gruppe||''))||st.bereiche[0];
      d.bereich=b.id;
    }
  });
  st.theme=st.theme||'auto';
  if(st.prefStaerke==null)st.prefStaerke=1;
  st.formTitel=st.formTitel??'';st.formTel=st.formTel??'';st.formMail=st.formMail??'';
  if(st.formNamen==null)st.formNamen=true;
  S.persons.forEach(p=>{p.pref=p.pref||{};p.dienste=p.dienste||[];});
}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):defaults();}catch(e){S=defaults();}fixS();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function applyTheme(){
  const t=(S&&S.settings&&!FORM)?S.settings.theme:'auto';
  const dark=t==='dark'||(t!=='light'&&window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
}
function makeIcon(){
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    x.fillStyle='#2f5d62';x.fillRect(0,0,180,180);
    x.fillStyle='#fff';x.fillRect(34,48,112,100);
    x.fillStyle='#e5a93d';x.fillRect(34,48,112,26);
    x.fillStyle='#2f5d62';
    for(let r=0;r<2;r++)for(let q=0;q<4;q++)x.fillRect(46+q*26,88+r*26,16,16);
    $('tIcon').href=c.toDataURL('image/png');
  }catch(e){}
}

const person=id=>S.persons.find(p=>p.id===id);
const pname=id=>person(id)?.name||'?';
const ptype=id=>S.settings.types.find(t=>t.id===id);
const bereich=id=>S.settings.bereiche.find(b=>b.id===id)||S.settings.bereiche[0];
const dBer=d=>bereich(d.bereich);
const absent=(pid,date)=>S.absences.some(a=>a.personId===pid&&a.von<=date&&date<=a.bis);
const tasksOn=date=>S.tasks.filter(t=>t.date===date);
const hasTask=(pid,date)=>S.tasks.some(t=>t.date===date&&t.personId===pid);
const weight=(pid,date)=>tasksOn(date).filter(t=>t.personId===pid).reduce((s,t)=>s+(Number(ptype(t.typeId)?.gewicht)||0),0);
const sortedPersons=()=>[...S.persons].sort(byName);
const personOpts=sel=>'<option value="">– Person wählen –</option>'+sortedPersons().map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');
const typeOpts=sel=>S.settings.types.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.name)} (${t.gewicht})</option>`).join('');
const slotsOf=d=>Math.max(1,Number(d.plaetze)||1);
const isSkip=date=>S.skip.some(s=>s.date===date);
const planDates=plan=>plan.dates.filter(d=>!isSkip(d)).sort();
const monthPicker=()=>`<input type="month" value="${ui.month}" onchange="setMonth(this.value)">`;
const planSelect=plan=>`<select onchange="ui.planId=this.value;render()">${S.plans.map(p=>`<option value="${p.id}" ${p.id===plan.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;

/* ============ Pläne ============ */
function curPlan(){
  let p=S.plans.find(x=>x.id===ui.planId);
  if(!p&&S.plans.length){p=S.plans[S.plans.length-1];ui.planId=p.id;}
  return p;
}
function datesIn(von,bis){
  const r=[];
  for(let d=toD(von);iso(d)<=bis;d.setDate(d.getDate()+1))if(S.settings.meetingDays.includes(d.getDay()))r.push(iso(d));
  return r;
}
function rebuildDates(plan){
  plan.dates=[...new Set([...datesIn(plan.von,plan.bis),...(plan.extra||[])])].sort();
  const ok=new Set(plan.dates);
  for(const k of Object.keys(plan.assign))if(!ok.has(k.split('|')[0]))delete plan.assign[k];
}
function nextPlanDefaults(){
  let von;
  if(S.plans.length){
    const last=[...S.plans].sort((a,b)=>a.bis.localeCompare(b.bis)).pop();
    const d=toD(last.bis);d.setDate(d.getDate()+1);von=iso(d);
  }else{
    const n=new Date(),f=new Date(n.getFullYear(),n.getMonth()+1,1,12);
    while(f.getDay()!==S.settings.midweek)f.setDate(f.getDate()+1);
    f.setDate(f.getDate()-((f.getDay()+6)%7));
    von=iso(f);
  }
  const b=toD(von);b.setDate(b.getDate()+34);
  return {von,bis:iso(b)};
}
function createPlan(){
  const von=$('npV').value,bis=$('npB').value;let name=$('npN').value.trim();
  if(!von||!bis||bis<von){alert('Bitte den Zeitraum prüfen.');return;}
  const first=datesIn(von,bis)[0]||von;
  if(!name)name=MN[Number(first.slice(5,7))-1]+' '+first.slice(0,4);
  const plan={id:uid(),name,von,bis,stand:iso(new Date()),dates:[],extra:[],assign:{}};
  rebuildDates(plan);S.plans.push(plan);ui.planId=plan.id;ui.newPlan=false;save();render();
}
function touch(plan){plan.stand=iso(new Date());save();render();}
function renamePlan(v){const p=curPlan();if(p&&v.trim()){p.name=v.trim();save();render();}}
function setRange(){
  const plan=curPlan(),v=$('pV').value,b=$('pB').value;
  if(!v||!b||b<v){alert('Bitte den Zeitraum prüfen.');return;}
  plan.von=v;plan.bis=b;rebuildDates(plan);touch(plan);
}
function addDate(){
  const v=$('newDate').value,plan=curPlan();if(!v)return;
  S.skip=S.skip.filter(s=>s.date!==v);
  plan.extra=plan.extra||[];
  if(!datesIn(plan.von,plan.bis).includes(v)&&!plan.extra.includes(v))plan.extra.push(v);
  rebuildDates(plan);touch(plan);
}
function delDate(d){
  const plan=curPlan();
  if((plan.extra||[]).includes(d)){plan.extra=plan.extra.filter(x=>x!==d);rebuildDates(plan);}
  else if(!isSkip(d))S.skip.push({date:d,why:'manuell entfernt',src:''});
  touch(plan);
}
function unskip(d){S.skip=S.skip.filter(s=>s.date!==d);save();render();}
function delPlan(){if(!confirm('Diesen Plan löschen?'))return;S.plans=S.plans.filter(p=>p.id!==ui.planId);ui.planId=null;save();render();}
function clearAssign(){if(!confirm('Alle Einteilungen dieses Plans löschen (auch gesperrte)?'))return;const p=curPlan();p.assign={};touch(p);}
function setAssign(key,pid){const p=curPlan();if(!pid)delete p.assign[key];else p.assign[key]={p:pid,lock:true};touch(p);}
function togLock(key){const a=curPlan().assign[key];if(a){a.lock=!a.lock;save();render();}}
function dayCount(plan,date){
  const c={};
  for(const k in plan.assign)if(k.startsWith(date+'|')){const p=plan.assign[k].p;c[p]=(c[p]||0)+1;}
  return c;
}
function planCounts(plan){const c={};for(const k in plan.assign){const p=plan.assign[k].p;c[p]=(c[p]||0)+1;}return c;}
function freeList(plan,date,pc){
  const cnt=dayCount(plan,date);
  return S.persons.filter(p=>p.aktiv&&!absent(p.id,date)&&!cnt[p.id]&&!hasTask(p.id,date)).sort((a,b)=>(pc[a.id]||0)-(pc[b.id]||0)||byName(a,b));
}
function pruneAssign(){
  const m={};S.settings.dienste.forEach(d=>m[d.id]=slotsOf(d));
  S.plans.forEach(pl=>{for(const k of Object.keys(pl.assign)){const [,did,s]=k.split('|');if(!(did in m)||Number(s)>=m[did])delete pl.assign[k];}});
}

/* ============ Automatische Einteilung ============ */
function generate(){
  const plan=curPlan();if(!plan)return;
  const {schwelle,maxPro}=S.settings,D=S.settings.dienste,st=Number(S.settings.prefStaerke)||0;
  for(const k of Object.keys(plan.assign))if(!plan.assign[k].lock)delete plan.assign[k];
  const count={};
  for(const k in plan.assign){const p=plan.assign[k].p;count[p]=(count[p]||0)+1;}
  const last={};
  S.plans.filter(p=>p.id!==plan.id).forEach(p=>{for(const k in p.assign){const dt=k.split('|')[0],pid=p.assign[k].p;if(dt<plan.von&&(!last[pid]||dt>last[pid]))last[pid]=dt;}});
  const qual=d=>S.persons.filter(p=>p.aktiv&&p.dienste.includes(d.id)).length;
  const order=D.map((d,i)=>({d,i})).sort((a,b)=>qual(a.d)-qual(b.d)||a.i-b.i).map(x=>x.d);
  for(const date of planDates(plan)){
    for(const dn of order){
      for(let s=0;s<slotsOf(dn);s++){
        const key=date+'|'+dn.id+'|'+s;
        if(plan.assign[key])continue;
        const today=dayCount(plan,date);
        let c=S.persons.filter(p=>p.aktiv&&p.dienste.includes(dn.id)&&!absent(p.id,date)&&weight(p.id,date)<=schwelle);
        if(!c.length)continue;
        const fresh=c.filter(p=>!today[p.id]);
        if(fresh.length)c=fresh;
        if(maxPro>0){const u=c.filter(p=>(count[p.id]||0)<maxPro);if(u.length)c=u;}
        const eff=p=>(count[p.id]||0)-st*((p.pref&&p.pref[dn.id])||0);
        // 1. heute noch nicht eingeteilt, 2. geringste Gesamtwichtigkeit der Programmaufgaben (keine = zuerst),
        // 3. wenigste Einsätze (gern = zählt weniger, ungern = zählt mehr), 4. am längsten nicht dran gewesen
        c.sort((a,b)=>(today[a.id]||0)-(today[b.id]||0)||weight(a.id,date)-weight(b.id,date)||eff(a)-eff(b)||(last[a.id]||'').localeCompare(last[b.id]||'')||byName(a,b));
        plan.assign[key]={p:c[0].id,lock:false};
        count[c[0].id]=(count[c[0].id]||0)+1;
      }
    }
    for(const k in plan.assign)if(k.startsWith(date+'|'))last[plan.assign[k].p]=date;
  }
  touch(plan);
}
function warnings(plan){
  const warn=[],info=[],noTask=[];
  for(const date of planDates(plan)){
    if(!tasksOn(date).length)noTask.push(dayHead(date));
    const cnt=dayCount(plan,date);
    for(const d of S.settings.dienste)for(let s=0;s<slotsOf(d);s++){
      const a=plan.assign[date+'|'+d.id+'|'+s],lab=d.name+(slotsOf(d)>1?' '+(s+1):'');
      if(!a){warn.push(`${fmt(date)}: „${lab}“ ist nicht besetzt.`);continue;}
      const n=pname(a.p),pp=person(a.p);
      if(absent(a.p,date))warn.push(`${fmt(date)}: ${n} ist abwesend (${lab}).`);
      else if(weight(a.p,date)>S.settings.schwelle)warn.push(`${fmt(date)}: ${n} hat an dem Tag eine zu wichtige Aufgabe (${lab}).`);
      if(pp&&!pp.dienste.includes(d.id))info.push(`${fmt(date)}: ${n} ist für „${d.name}“ nicht als geeignet eingetragen.`);
      else if(pp&&pp.pref&&pp.pref[d.id]<0)info.push(`${fmt(date)}: ${n} macht „${d.name}“ ungern.`);
    }
    for(const pid in cnt)if(cnt[pid]>1)info.push(`${fmt(date)}: ${pname(pid)} ist ${cnt[pid]}× eingeteilt (rot).`);
  }
  if(noTask.length)info.unshift('Keine Programmaufgaben erfasst für: '+noTask.join(', ')+'. Dort wird nur nach Abwesenheit und Einsatzzahl eingeteilt – bitte Programm-PDF importieren.');
  return {warn,info};
}

/* ============ Ansicht: Dienstplan ============ */
function slotHtml(plan,date,d,s,cnt,pc){
  const key=date+'|'+d.id+'|'+s,a=plan.assign[key],n=slotsOf(d);
  const cls=[];
  if(a){
    if(absent(a.p,date))cls.push('bad');
    else if(weight(a.p,date)>S.settings.schwelle)cls.push('warn');
    if(cnt[a.p]>1)cls.push('dbl');
  }
  const list=S.persons.filter(p=>p.aktiv||(a&&p.id===a.p)).map(p=>{
    const ab=absent(p.id,date),others=(cnt[p.id]||0)-(a&&a.p===p.id?1:0),w=weight(p.id,date);
    const free=!ab&&!others&&!hasTask(p.id,date);
    let note='';
    if(ab)note=' – abwesend';
    else if(w>0)note=` – Aufgabe (${w})`;
    if(others>0)note+=' – schon eingeteilt';
    if(!p.dienste.includes(d.id))note+=' – nicht für diesen Dienst';
    else{const pf=(p.pref&&p.pref[d.id])||0;if(pf>0)note+=' – gern';else if(pf<0)note+=' – ungern';}
    return {p,free,txt:(free?'● ':'')+p.name+note};
  }).sort((x,y)=>(y.free-x.free)||(x.free?((pc[x.p.id]||0)-(pc[y.p.id]||0)):0)||byName(x.p,y.p));
  const opts=list.map(o=>`<option value="${o.p.id}" ${a&&a.p===o.p.id?'selected':''}>${esc(o.txt)}</option>`).join('');
  const sep=(d.wechsel&&s<n-1)?' /':'';
  return `<div class="sl ${cls.join(' ')}"><select class="noprint" onchange="setAssign('${key}',this.value)"><option value="">– frei –</option>${opts}</select>`
    +(a?`<button class="lk noprint" title="Gesperrt = bleibt bei „Plan automatisch erstellen“ erhalten" onclick="togLock('${key}')">${a.lock?'🔒':'🔓'}</button>`:'')
    +`<span class="pv">${a?esc(pname(a.p))+sep:'&nbsp;'}</span></div>`;
}

function vVerf(){
  const plan=curPlan();
  if(!plan)return '<div class="card"><p class="hint">Lege zuerst im Reiter „Dienstplan“ einen Plan an.</p></div>';
  const dates=planDates(plan),sch=S.settings.schwelle,pc=planCounts(plan);
  const dm={};S.settings.dienste.forEach(d=>dm[d.id]=d);
  const freeBy=dates.map(()=>0);
  const rows=S.persons.filter(p=>p.aktiv).sort(byName).map(p=>{
    let free=0;
    const cells=dates.map((date,di)=>{
      const ab=absent(p.id,date),tk=tasksOn(date).filter(t=>t.personId===p.id),w=weight(p.id,date);
      const mine=Object.keys(plan.assign).filter(k=>k.startsWith(date+'|')&&plan.assign[k].p===p.id).map(k=>dm[k.split('|')[1]]).filter(Boolean);
      let cls='cf',h='';
      if(ab){cls='cb';h+='abwesend<br>';}
      tk.forEach(t=>{h+=`${esc(ptype(t.typeId)?.name||'?')} <span class="mut">(${ptype(t.typeId)?.gewicht??'?'})</span><br>`;});
      mine.forEach(d=>{h+=`<span class="chip" style="${cv(dBer(d).farbe)}">${esc(d.name)}</span>`;});
      if(!ab){
        if(tk.length&&w>sch)cls='cs';
        else if(tk.length)cls='cl';
        else if(mine.length)cls='cd';
      }
      if(cls==='cf'){h='frei';free++;freeBy[di]++;}
      return `<td class="${cls}">${h}</td>`;
    }).join('');
    return `<tr><th class="nm">${esc(p.name)}</th>${cells}<td class="c">${pc[p.id]||0}</td><td class="c">${free}</td></tr>`;
  }).join('');
  return `<div class="card">
    <div class="row">${planSelect(plan)}</div>
    <h2>Wer hat noch nichts? – ${esc(plan.name)}</h2>
    <p class="hint">Grün = frei (keine Programmaufgabe, nicht abwesend, noch nicht eingeteilt). Gelb = leichte Aufgabe, darf noch eingeteilt werden. Orange = zu wichtige Aufgabe, gesperrt. Rot = abwesend. Farbige Schilder = für diesen Dienst eingeteilt. „Einsätze“ = Dienste in diesem Plan.</p>
    <div class="scroll"><table class="mx"><thead><tr><th>Name</th>${dates.map(d=>`<th class="c">${dayHead(d)}</th>`).join('')}<th class="c">Einsätze</th><th class="c">Tage frei</th></tr></thead>
    <tbody>${rows||'<tr><td class="mut">Noch keine Personen eingetragen.</td></tr>'}</tbody>
    <tfoot><tr><th>Frei pro Tag</th>${freeBy.map(n=>`<th class="c">${n}</th>`).join('')}<th></th><th></th></tr></tfoot></table></div></div>`;
}

function addAbw(){

function delAbw(id){S.absences=S.absences.filter(a=>a.id!==id);save();render();}
function cleanAbw(){const t=iso(new Date());S.absences=S.absences.filter(a=>a.bis>=t);save();render();}

function parseDate(s){
  s=String(s||'').trim().replace(/^[A-Za-zäöüÄÖÜ]{2,10},?\s+/,'');let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})\.\s?(\d{1,2})\.\s?(\d{4}|\d{2})$/))){const y=m[3].length===2?2000+Number(m[3]):+m[3];return y+'-'+pad(+m[2])+'-'+pad(+m[1]);}
  return null;
}
function matchPerson(name){
  const n=norm(name);if(!n)return '';
  let p=S.persons.find(x=>norm(x.name)===n);if(p)return p.id;
  const t=n.split(' ');
  if(t.length>1){const rev=t.slice(1).join(' ')+' '+t[0];p=S.persons.find(x=>norm(x.name)===rev);if(p)return p.id;}
  return '';
}
function parseAbwText(txt){
  const out=[];
  for(const raw of txt.split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    const f=l.split(/\s*[|;\t]\s*/);
    if(f.length<2)continue;
    const von=parseDate(f[1]);if(!von)continue;
    let bis=f[2]?parseDate(f[2]):null;if(!bis||bis<von)bis=von;
    let nm=f[0];const mm=nm.match(/.*:\s+(.+)$/);if(mm)nm=mm[1];   // WhatsApp-Präfix „[12:30, 08.10.2026] Absender: “ entfernen
    nm=nm.trim();
    const pid=matchPerson(nm);
    out.push({on:!!pid,name:nm,pid,von,bis,note:(f.slice(3).join(' ')||'').trim()});
  }
  return out;
}
function abwCheck(){
  const rows=parseAbwText($('abwTxt').value);
  if(!rows.length){alert('Keine gültigen Zeilen gefunden. Erwartet: Name | von | bis | Notiz (Datum z. B. 08.11.2026).');return;}
  ui.abwImp=rows;render();
}

    const bis=r.bis<r.von?r.von:r.bis;
    if(S.absences.some(a=>a.personId===r.pid&&a.von===r.von&&a.bis===bis)){dup++;return;}
    S.absences.push({id:uid(),personId:r.pid,von:r.von,bis,note:r.note,src:''});n++;
  });
  ui.abwImp=null;save();render();
  alert(n+' Abwesenheiten übernommen'+(dup?' ('+dup+' waren schon vorhanden).':'.'));
}

/* ============ PDF-Import ============ */
const MON={januar:1,jan:1,februar:2,feb:2,marz:3,mar:3,maerz:3,mrz:3,april:4,apr:4,mai:5,juni:6,jun:6,juli:7,jul:7,august:8,aug:8,september:9,sept:9,sep:9,oktober:10,okt:10,november:11,nov:11,dezember:12,dez:12};
function weekRange(line,year){
  const m=line.match(/(\d{1,2})\.\s*([A-Za-zÄÖÜäöüß]{3,})?\s*[-–—]\s*(\d{1,2})\.\s*([A-Za-zÄÖÜäöüß]{3,})/);
  if(!m)return null;
  const em=MON[norm(m[4])],sm=m[2]?MON[norm(m[2])]:em;
  if(!em||!sm)return null;
  const start=new Date(year,sm-1,+m[1],12);
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);if(d.getDay()===S.settings.midweek)return iso(d);}
  return null;
}
function findDate(line,year){
  let m=line.match(/(\d{1,2})\.\s?(\d{1,2})\.(?:\s?(\d{4}|\d{2})(?!\d))?/),d,mo,y;
  if(m){d=+m[1];mo=+m[2];y=m[3]?(+m[3]<100?2000+Number(m[3]):+m[3]):year;}
  else{
    m=line.match(/^\s*(\d{1,2})\.?\s*(Januar|Februar|März|Maerz|April|Mai|Juni|Juli|August|September|Oktober|November|Dezember)\b\.?(?:\s+(\d{4}))?/i);
    if(!m)return null;
    d=+m[1];mo=MON[norm(m[2])];y=m[3]?+m[3]:year;
  }
  if(!mo||mo>12||d<1||d>31)return null;
  return y+'-'+pad(mo)+'-'+pad(d);
}
async function readPdf(file){
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];let cur=null;
    for(const it of items){
      if(cur&&Math.abs(cur.y-it.y)<=3)cur.items.push(it);
      else{cur={y:it.y,items:[it]};lines.push(cur);}
    }
    for(const l of lines){
      l.items.sort((a,b)=>a.x-b.x);
      let s='',px=null;
      for(const it of l.items){
        if(px!==null){const gap=it.x-px;s+=gap>12?'  ':(gap>1?' ':'');}
        s+=it.s;px=it.x+it.w;
      }
      if(s.trim())out.push(s.trim());
    }
  }
  return out;
}
function lev(a,b){
  const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;
  const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function personPool(){
  const tk=S.persons.map(p=>({p,t:norm(p.name).split(' ').filter(Boolean)}));
  const cnt={};tk.forEach(x=>{if(x.t.length>1){const l=x.t[x.t.length-1];cnt[l]=(cnt[l]||0)+1;}});
  return tk.filter(x=>x.p.aktiv&&x.t.length>1).map(x=>({p:x.p,first:x.t[0],last:x.t[x.t.length-1],uniq:cnt[x.t[x.t.length-1]]===1}));
}
function findPeople(toks,pool){
  const out=[];
  for(const P of pool){
    for(let i=0;i<toks.length;i++){
      const tk=toks[i],exact=tk===P.last;
      if(!exact&&!(P.last.length>=7&&tk.length>=6&&lev(tk,P.last)<=1))continue;
      const prev=toks[i-1]||'',ini=prev.length===1&&/[a-z]/.test(prev);
      const pm=prev===P.first||(ini&&prev===P.first[0]);
      if(pm||(exact&&!prev&&P.uniq)){out.push(P.p);break;}
    }
  }
  return out;
}
function typeByKw(n){
  for(const t of S.settings.types){
    const ks=(t.keywords||'').split(';').map(norm).filter(Boolean);
    if(ks.some(k=>n.includes(k)))return t.id;
  }
  return null;
}
function durType(m){
  m=Number(m);if(!m)return null;
  const t=S.settings.types.filter(x=>Number(x.bis)>0).sort((a,b)=>a.bis-b.bis).find(x=>m<=Number(x.bis));
  return t?t.id:null;
}
function defType(){
  const t=S.settings.types.find(t=>!(t.keywords||'').trim()&&!Number(t.bis));
  return (t||S.settings.types[S.settings.types.length-1])?.id||'';
}
function parseLines(lines,year,src){
  const pool=personPool(),rows=[],abs=[],skips=[];
  let cur=null,ctx=null;
  const toks=s=>s.split(' ').filter(Boolean);
  for(const raw of lines){
    const n=norm(raw),wk=weekRange(raw,year),dt=wk||findDate(raw,year);
    if(dt){cur=dt;ctx=null;}
    if(dt&&!wk&&n.includes('kongress')){skips.push({on:true,date:dt,why:raw.trim().slice(0,70),src});continue;}
    if(/schatze aus gottes wort|uns im dienst verbessern|unser leben als christ/.test(n)){ctx=null;continue;}
    const parts=n.split(/\bauswarts\b/);
    const min=(raw.match(/\((\d+)\s*min/i)||[])[1];
    const kw=typeByKw(parts[0]);
    const tid=kw||durType(min)||(ctx&&(ctx.typeId||durType(ctx.min)))||defType();
    if(kw||min)ctx={typeId:kw,min};
    if(!cur)continue;
    findPeople(toks(parts[0]),pool).forEach(p=>{
      if(!rows.some(r=>r.date===cur&&r.pid===p.id&&r.typeId===tid))rows.push({on:true,date:cur,pid:p.id,typeId:tid,label:raw.trim().slice(0,90),src});
    });
    if(parts.length>1)findPeople(toks(parts.slice(1).join(' ')),pool).forEach(p=>{
      if(!abs.some(a=>a.date===cur&&a.pid===p.id))abs.push({on:true,date:cur,pid:p.id,note:'Auswärts (öffentl. Vortrag)',src});
    });
  }
  return {rows,abs,skips};
}
async function onPdfs(inp){
  const files=[...inp.files];if(!files.length)return;
  if(typeof pdfjsLib==='undefined'){alert('Die PDF-Bibliothek konnte nicht geladen werden (Internetverbindung nötig).');return;}
  const imp={files:[],rows:[],abs:[],skips:[],notes:[],raw:{}};
  for(const f of files){
    try{
      const lines=await readPdf(f);
      if(!lines.length){imp.notes.push(f.name+': kein Text gefunden (Scan/Foto?).');continue;}
      const all=norm(lines.join(' '));
      if(all.includes('ordnungsplan')&&all.includes('technik')){imp.notes.push(f.name+': Das ist ein Technikplan, kein Programm – wird nicht importiert.');continue;}
      const r=parseLines(lines,ui.year,f.name);
      imp.files.push(f.name);imp.raw[f.name]=lines;
      imp.rows.push(...r.rows);imp.abs.push(...r.abs);imp.skips.push(...r.skips);
    }catch(e){imp.notes.push(f.name+': '+e.message);}
  }
  ui.imp=imp;render();
}
function impSet(list,i,k,v){ui.imp[list][i][k]=v;}

  ${im.skips.length?`<h3>Entfallende Termine (${im.skips.length})</h3><div class="scroll"><table><tr><th>Ja</th><th>Datum</th><th>Zeile im PDF</th></tr>${t3}</table></div>`:''}

function resetAll(){if(confirm('WIRKLICH alle Daten löschen?')){S=defaults();fixS();save();ui.planId=null;applyTheme();render();}}
function vEinst(){
  const s=S.settings;
  const bOpts=sel=>s.bereiche.map(b=>`<option value="${b.id}" ${b.id===sel?'selected':''}>${esc(b.name)}</option>`).join('');
  const bRows=s.bereiche.map((b,i)=>`<tr><td><input value="${esc(b.name)}" onchange="setL('bereiche',${i},'name',this.value)"></td>
    <td><input type="color" value="${b.farbe}" onchange="setL('bereiche',${i},'farbe',this.value)"></td>
    <td><button class="x" onclick="delBereich(${i})">✕</button></td></tr>`).join('');
  const dRows=s.dienste.map((d,i)=>`<tr><td><input value="${esc(d.name)}" onchange="setL('dienste',${i},'name',this.value)"></td>
    <td><select onchange="setL('dienste',${i},'bereich',this.value)">${bOpts(d.bereich)}</select></td>
    <td><input type="number" min="1" max="6" value="${slotsOf(d)}" style="width:60px" onchange="setL('dienste',${i},'plaetze',Number(this.value))"></td>
    <td class="c"><input type="checkbox" ${d.wechsel?'checked':''} onchange="setL('dienste',${i},'wechsel',this.checked)"></td>
    <td class="nw"><button onclick="mv('dienste',${i},-1)">↑</button><button onclick="mv('dienste',${i},1)">↓</button><button class="x" onclick="delDienst(${i})">✕</button></td></tr>`).join('');
  const tRows=s.types.map((t,i)=>`<tr><td><input value="${esc(t.name)}" onchange="setL('types',${i},'name',this.value)"></td>
    <td><input type="number" min="0" max="99" value="${t.gewicht}" style="width:70px" onchange="setL('types',${i},'gewicht',Number(this.value))"></td>
    <td><input value="${esc(t.keywords)}" style="width:100%" onchange="setL('types',${i},'keywords',this.value)" placeholder="Stichwörter mit ; trennen"></td>
    <td><input type="number" min="0" max="999" value="${t.bis??''}" style="width:70px" onchange="setL('types',${i},'bis',this.value)" placeholder="–"></td>
    <td class="nw"><button onclick="mv('types',${i},-1)">↑</button><button onclick="mv('types',${i},1)">↓</button><button class="x" onclick="delType(${i})">✕</button></td></tr>`).join('');
  return `
  <div class="card"><h2>Darstellung</h2>
    <p><label>Farbschema: <select onchange="setSet('theme',this.value);applyTheme()">${[['auto','Automatisch (wie Gerät)'],['light','Hell'],['dark','Dunkel']].map(([v,t])=>`<option value="${v}" ${s.theme===v?'selected':''}>${t}</option>`).join('')}</select></label></p>
    <p class="hint">Der Ausdruck ist immer hell, damit er auf Papier lesbar bleibt.</p></div>
  <div class="card"><h2>Bereiche &amp; Farben</h2>
    <p class="hint">Jeder Dienst gehört zu einem Bereich. Die Farbe des Bereichs färbt Zeilenkopf und Zellen im Plan, im Druck und in der Verfügbarkeitsübersicht.</p>
    <table><tr><th>Name</th><th>Farbe</th><th></th></tr>${bRows}</table><p><button onclick="addBereich()">+ Bereich</button></p></div>
  <div class="card"><h2>Dienste (Zeilen im Plan)</h2>
    <p class="hint">Plätze = wie viele Personen pro Termin in der Zelle stehen. „Wechsel“ = die Personen wechseln in der Programmmitte (Ausdruck: Name / Name). Dienste mit den wenigsten geeigneten Personen werden bei der Einteilung zuerst besetzt.</p>
    <div class="scroll"><table><tr><th>Name</th><th>Bereich</th><th>Plätze</th><th class="c">Wechsel</th><th></th></tr>${dRows}</table></div><p><button onclick="addDienst()">+ Dienst</button></p></div>
  <div class="card"><h2>Aufgabenarten &amp; Wichtigkeit</h2>
    <p class="hint">Gewicht = wie wichtig die Aufgabe ist. Wer an einem Tag zusammen mehr als die <b>Sperrschwelle</b> hat, wird dort nicht eingeteilt (Vorsitz 10 → gesperrt, Kurzteil 2 → darf Mikrofon). Wer gar nichts hat, kommt zuerst dran, danach die mit dem geringsten Gewicht. Beim PDF-Import gilt: Zuerst zählen die <b>Stichwörter</b> (erste passende Art von oben), sonst die <b>Dauer</b> („bis Min.“ – die kleinste passende Grenze), sonst „Sonstige Aufgabe“.</p>
    <div class="scroll"><table><tr><th>Name</th><th>Gewicht</th><th>Stichwörter</th><th>Dauer bis Min.</th><th></th></tr>${tRows}</table></div><p><button onclick="addType()">+ Aufgabenart</button></p></div>
  <div class="card"><h2>Allgemein</h2>
    <p><b>Versammlungstage:</b> ${[1,2,3,4,5,6,0].map(d=>`<label class="chk"><input type="checkbox" ${s.meetingDays.includes(d)?'checked':''} onchange="togDay(${d})"> ${WD[d]}</label>`).join('')}
    <span class="mut">(gilt für neue Pläne; bei bestehenden unter „Zeitraum → Übernehmen“)</span></p>
    <p><label>Tag der Zusammenkunft unter der Woche (für das Wochenprogramm-PDF): <select onchange="setSet('midweek',Number(this.value))">${[1,2,3,4,5,6].map(d=>`<option value="${d}" ${s.midweek===d?'selected':''}>${WDL[d]}</option>`).join('')}</select></label></p>
    <p><label>Sperrschwelle (Summe der Gewichte pro Tag): <input type="number" min="0" max="99" value="${s.schwelle}" style="width:70px" onchange="setSet('schwelle',Number(this.value))"></label></p>
    <p><label>Einfluss der Präferenzen „gern/ungern“: <select onchange="setSet('prefStaerke',Number(this.value))">${[[0,'aus'],[1,'leicht'],[2,'stark']].map(([v,t])=>`<option value="${v}" ${Number(s.prefStaerke)===v?'selected':''}>${t}</option>`).join('')}</select></label></p>
    <p><label>Max. Einsätze pro Person und Plan (0 = unbegrenzt, wird nur wenn möglich eingehalten): <input type="number" min="0" max="99" value="${s.maxPro}" style="width:70px" onchange="setSet('maxPro',Number(this.value))"></label></p>
    <p>Legende unter dem Plan (eine Zeile pro Hinweis):<br><textarea rows="4" style="width:100%" onchange="setSet('legende',this.value)">${esc(s.legende)}</textarea></p></div>
  <div class="card"><h2>Datensicherung</h2>
    <p class="hint">Die Daten liegen nur in diesem Browser auf diesem Gerät. PC und iPhone haben getrennte Daten. Über die Sicherung kannst du sie übertragen. Bitte regelmäßig sichern.</p>
    <div class="row"><button class="pri" onclick="exportJ()">Sicherung herunterladen</button>
    <label>Sicherung laden: <input type="file" accept=".json" onchange="importJ(this)"></label>
    <button class="x" onclick="resetAll()">Alles löschen</button></div></div>`;
}

/* ============ Steuerung ============ */
const now=new Date();
const ui={tab:'plan',planId:null,newPlan:false,month:now.getFullYear()+'-'+pad(now.getMonth()+1),year:now.getFullYear(),imp:null,abwImp:null,fe:[],fname:(()=>{try{return localStorage.getItem('dp_formname')||'';}catch(e){return '';}})()};
function go(t){ui.tab=t;render();window.scrollTo(0,0);}
function setMonth(v){if(v){ui.month=v;render();}}
function render(){
  const y=window.scrollY;
  if(FORM){$('app').innerHTML=vForm();window.scrollTo(0,y);return;}
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===ui.tab));
  const f={plan:vPlan,verf:vVerf,abw:vAbw,aufg:vAufg,pers:vPers,einst:vEinst}[ui.tab];
  $('app').innerHTML=f();
  window.scrollTo(0,y);
}
async function initPdf(){
  if(typeof pdfjsLib==='undefined')return;
  const w='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  pdfjsLib.GlobalWorkerOptions.workerSrc=w;
  try{const r=await fetch(w);pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(await r.blob());}catch(e){}
}
if(FORM){
  S=defaults();fixS();
  document.querySelector('nav').style.display='none';
  document.querySelector('header h1').textContent=FORM.t||'Abwesenheit melden';
  document.title='Abwesenheit melden';
}else load();
applyTheme();
if(window.matchMedia)try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);}catch(e){}
makeIcon();
if(!FORM)initPdf();
render();
</script>
</body>
</html>
